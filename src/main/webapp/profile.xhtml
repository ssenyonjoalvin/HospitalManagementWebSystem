<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui">

<ui:composition template="template/template.xhtml">
    <ui:define name="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <h2 class="mb-4">
                        <i class="fa-solid fa-user"></i> My Profile
                    </h2>
                </div>
            </div>
            <h:form>
                <h:messages globalOnly="true" layout="table" styleClass="alert alert-info mb-3"/>
                <p:growl id="growl" showDetail="true" globalOnly="true"/>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="fa-solid fa-user"></i> Account Information
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Full Name:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.fullName}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Email:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.email}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Username:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUserAccount.userName}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Role:</strong></div>
                                    <div class="col-sm-8">
                                        <span class="badge bg-primary">
                                            <h:outputText value="#{profileBean.currentUser.role}"/>
                                        </span>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Gender:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.gender}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Date of Birth:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.dateOfBirth}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Phone Number:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.phoneNumber}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Address:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.address}"/>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-4"><strong>Next of Kin:</strong></div>
                                    <div class="col-sm-8">
                                        <h:outputText value="#{profileBean.currentUser.nextOfKin}"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="fa-solid fa-key"></i> Change Password
                                </h5>
                            </div>
                            <div class="card-body">
                                <h:commandButton value="Change Password" action="#{profileBean.toggleChangePassword}" rendered="#{!profileBean.changingPassword}" styleClass="btn btn-outline-primary mb-3"/>
                                <h:panelGroup rendered="#{profileBean.changingPassword}">
                                    <div class="mb-3">
                                        <label for="currentPassword" class="form-label">Current Password</label>
                                        <h:inputSecret id="currentPassword" value="#{profileBean.currentPassword}" styleClass="form-control" required="true"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label">New Password</label>
                                        <h:inputSecret id="newPassword" value="#{profileBean.newPassword}" styleClass="form-control" required="true"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                        <h:inputSecret id="confirmPassword" value="#{profileBean.confirmPassword}" styleClass="form-control" required="true"/>
                                    </div>
                                    <h:commandButton value="Save Changes" action="#{profileBean.updateProfile}" styleClass="btn btn-primary me-2">
                                        <f:ajax execute="@form" render="@form growl"/>
                                    </h:commandButton>
                                    <h:commandButton value="Cancel" action="#{profileBean.toggleChangePassword}" immediate="true" styleClass="btn btn-secondary"/>
                                </h:panelGroup>
                            </div>
                        </div>
                    </div>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
</html>
